[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "homer-local-assistant"
version = "0.3.0"
description = "A small local helper for terminal commands you can review before running"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["cli", "local-ai", "macos", "ollama", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "bashlex>=0.18",
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/pietroforni/homer"
Issues = "https://github.com/pietroforni/homer/issues"
Source = "https://github.com/pietroforni/homer"

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.14,<1",
]

[project.scripts]
homer = "homer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/homer"]

[tool.pytest.ini_options]
addopts = "-q --cov=homer --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

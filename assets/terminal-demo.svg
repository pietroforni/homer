<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title description">
  <title id="title">A Homer dry run in the terminal</title>
  <desc id="description">Homer consults the local find manual and turns a project-folder question into an explained command without executing it.</desc>
  <rect width="960" height="390" rx="14" fill="#101216"/>
  <path d="M0 48h960" stroke="#2b3038"/>
  <text x="28" y="31" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">terminal — homer</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="28" y="88" fill="#79c0ff">$</text>
    <text x="50" y="88" fill="#f0f3f6">homer --dry-run "find Python files changed this week"</text>
    <text x="28" y="138" fill="#d2a8ff" font-weight="600">Proposed command</text>
    <rect x="28" y="157" width="904" height="46" rx="7" fill="#171a20"/>
    <text x="44" y="187" fill="#a5d6a7">find . -type f -name '*.py' -mtime -7</text>
    <text x="28" y="242" fill="#d2a8ff" font-weight="600">Explanation</text>
    <text x="28" y="275" fill="#c9d1d9">Find Python files modified in the last seven days.</text>
    <text x="28" y="310" fill="#8b949e">Consulted local manuals: find</text>
    <text x="28" y="360" fill="#79c0ff">Dry run: command was not executed.</text>
  </g>
</svg>

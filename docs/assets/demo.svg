<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
  <title id="title">Homer terminal dry-run</title>
  <desc id="description">Homer turns a plain English request into a reviewed shell command and does not execute it in dry-run mode.</desc>
  <rect width="960" height="410" rx="18" fill="#111318"/>
  <rect width="960" height="48" rx="18" fill="#20242c"/>
  <rect y="30" width="960" height="18" fill="#20242c"/>
  <circle cx="26" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="7" fill="#febc2e"/>
  <circle cx="74" cy="24" r="7" fill="#28c840"/>
  <text x="480" y="30" text-anchor="middle" fill="#a9b1bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">homer — dry run</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="28" y="88" fill="#72d0ff">$</text>
    <text x="50" y="88" fill="#eef2f7">homer --dry-run "show the five largest folders here"</text>
    <text x="28" y="138" fill="#f4c76b" font-weight="600">Proposed command</text>
    <rect x="28" y="158" width="904" height="45" rx="8" fill="#191d24"/>
    <text x="44" y="187" fill="#9fe6a0">du -sh * | sort -hr | head -n 5</text>
    <text x="28" y="244" fill="#f4c76b" font-weight="600">Explanation</text>
    <text x="28" y="278" fill="#cbd2dc">Measure each item, sort the sizes from largest to smallest,</text>
    <text x="28" y="307" fill="#cbd2dc">then show the first five results.</text>
    <text x="28" y="361" fill="#72d0ff">Dry run: command was not executed.</text>
  </g>
</svg>
